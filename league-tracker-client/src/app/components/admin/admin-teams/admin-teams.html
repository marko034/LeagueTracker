<form [formGroup]="teamForm" (ngSubmit)="onSubmitTeam()">
    <fieldset>
        <legend>{{ editingTeamId() ? 'Izmeni tim' : 'Novi tim' }}</legend>
        <label>Naziv <input type="text" formControlName="name" /></label>
        <label>Logo tima</label>
        <app-image-upload formControlName="logoUrl" [fallbackText]="teamForm.value.name?.charAt(0) ?? ''" />
    </fieldset>

    <button type="submit">{{ editingTeamId() ? 'Sačuvaj izmene' : 'Kreiraj tim' }}</button>
    @if (editingTeamId()) {
    <button type="button" (click)="cancelEditTeam()">Otkaži</button>
    }
</form>

<h3 style="margin-top: 2rem;">Postojeći timovi</h3>
<table>
    <thead>
        <tr>
            <th>Naziv</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (team of allTeams(); track team.id) {
        <tr>
            <td class="row-with-avatar">
                <app-editable-avatar shape="square" [imageUrl]="team.logoUrl" [fallbackText]="team.name.charAt(0)"
                    (imageChanged)="onLogoChanged(team, $event)" (failed)="onImageFailed($event)" />
                {{ team.name }}
            </td>
            <td>
                <button type="button" (click)="startEditTeam(team)">Izmeni</button>
                <button type="button" (click)="deleteTeam(team.id)">Obriši</button>
            </td>
        </tr>
        }
    </tbody>
</table>
